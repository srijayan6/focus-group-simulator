<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Group Simulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #E7E2D3;
    color: #201D16;
    font-family: Georgia, serif;
    padding: 40px 24px 80px;
  }
  .wrap { max-width: 840px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  header p { color: #4A463C; max-width: 60ch; line-height: 1.5; }
  label { font-weight: bold; display: block; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 90px; padding: 12px;
    font-family: Georgia, serif; font-size: 16px;
    border: 1px solid #C9C2AC; background: #F6F3E9;
    border-radius: 2px;
  }
  .persona-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px; margin: 12px 0 24px;
  }
  .persona-pick {
    border: 1px solid #C9C2AC; background: #F6F3E9; padding: 12px 14px;
    cursor: pointer; border-radius: 2px; transition: border-color 0.15s ease;
  }
  .persona-pick:hover { border-color: #8A8371; }
  .persona-pick.selected { border-color: #201D16; box-shadow: inset 0 0 0 1px #201D16; }
  .persona-pick strong { display: block; margin-bottom: 2px; }
  .persona-pick small { color: #4A463C; }
  button {
    background: #201D16; color: #F6F3E9; border: none; padding: 13px 22px;
    font-size: 14px; cursor: pointer; border-radius: 2px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button:hover:not(:disabled) { background: #35311F; }
  .error { color: #9B3A2C; margin-top: 12px; font-size: 14px; }

  .loading-row {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    color: #4A463C;
    font-size: 14px;
  }
  .loading-row.active { display: flex; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #C9C2AC;
    border-top-color: #201D16;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results { display: none; margin-top: 8px; }
  #results h2 {
    font-size: 13px; text-transform: none; letter-spacing: 0.02em;
    color: #4A463C; border-top: 1px solid #C9C2AC; padding-top: 24px; margin-bottom: 16px;
  }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px; margin: 0 0 28px;
  }
  .card {
    background: #F6F3E9; border: 1px solid #C9C2AC; padding: 16px 18px; border-radius: 2px;
  }
  .card small {
    font-size: 11px; color: #4A463C; background: #DCD5BE;
    padding: 2px 8px; display: inline-block; margin-bottom: 8px;
  }
  .card h4 { margin: 0 0 8px; font-size: 16px; }
  .card p { margin: 0; font-size: 15px; line-height: 1.5; }

  .synthesis {
    border: 1px solid #201D16; background: #F6F3E9; padding: 20px 22px; border-radius: 2px;
  }
  .synthesis h3 { margin: 0 0 14px; font-size: 13px; color: #4A463C; }
  .synthesis p { margin: 0 0 14px; font-size: 15px; line-height: 1.5; }
  .synthesis p:last-child { margin-bottom: 0; }

  @media (max-width: 600px) {
    body { padding: 24px 16px 60px; }
    h1 { font-size: 24px; }
    .persona-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .cards { grid-template-columns: 1fr; }
    button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Focus Group Simulator</h1>
    <p>Describe an idea. Distinct personas react independently — no consensus, no averaging.</p>
  </header>

  <label for="concept">Your idea:</label>
  <textarea id="concept" placeholder="e.g. A $15/month app that plans weekly meals based on what's in your fridge."></textarea>

  <p><strong>Select 3-5 personas:</strong></p>
  <div class="persona-grid" id="personaGrid"></div>

  <button id="runBtn">Run the group</button>
  <div class="error" id="errorMsg" style="display:none;"></div>

  <div class="loading-row" id="loadingRow">
    <div class="spinner"></div>
    <span>Running the group — this takes about 15-20 seconds...</span>
  </div>

  <div id="results">
    <h2>Reactions</h2>
    <div class="cards" id="cards"></div>
    <div class="synthesis" id="synthesis" style="display:none;">
      <h3>Synthesis</h3>
      <p><strong>Agreement:</strong> <span id="agreeText"></span></p>
      <p><strong>Tension:</strong> <span id="tensionText"></span></p>
      <p><strong>Blind spot:</strong> <span id="blindspotText"></span></p>
    </div>
  </div>
</div>

<script>
const PERSONAS = [
  { id: "skeptic", name: "The Skeptic", tag: "burned before" },
  { id: "budget", name: "The Budget-Conscious One", tag: "counts every dollar" },
  { id: "convenience", name: "The Busy Convenience-Seeker", tag: "no time to waste" },
  { id: "loyalist", name: "The Loyalist", tag: "already has a solution" },
  { id: "enthusiast", name: "The Enthusiast", tag: "excited by new things" }
];

let selected = new Set(["skeptic", "budget", "convenience"]);

function renderPersonaGrid() {
  const grid = document.getElementById("personaGrid");
  grid.innerHTML = "";
  PERSONAS.forEach(p => {
    const el = document.createElement("div");
    el.className = "persona-pick" + (selected.has(p.id) ? " selected" : "");
    el.innerHTML = `<strong>${p.name}</strong><small>${p.tag}</small>`;
    el.onclick = () => {
      if (selected.has(p.id)) selected.delete(p.id);
      else selected.add(p.id);
      renderPersonaGrid();
    };
    grid.appendChild(el);
  });
}
renderPersonaGrid();

document.getElementById("runBtn").addEventListener("click", async () => {
  const errorEl = document.getElementById("errorMsg");
  const loadingRow = document.getElementById("loadingRow");
  const resultsEl = document.getElementById("results");
  errorEl.style.display = "none";

  const concept = document.getElementById("concept").value.trim();
  if (!concept) { errorEl.textContent = "Describe your idea first."; errorEl.style.display = "block"; return; }
  if (selected.size < 3) { errorEl.textContent = "Select at least 3 personas."; errorEl.style.display = "block"; return; }

  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  resultsEl.style.display = "none";
  loadingRow.classList.add("active");

  try {
    const response = await fetch("/api/run-focus-group", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ concept, personas: Array.from(selected) })
    });
    if (!response.ok) throw new Error("Server error");
    const data = await response.json();

    const cardsEl = document.getElementById("cards");
    cardsEl.innerHTML = data.reactions.map(r => `
      <div class="card">
        <small>${r.tag}</small>
        <h4>${r.name}</h4>
        <p>${r.reaction}</p>
      </div>
    `).join("");

    document.getElementById("agreeText").textContent = data.synthesis.agreement || "-";
    document.getElementById("tensionText").textContent = data.synthesis.tension || "-";
    document.getElementById("blindspotText").textContent = data.synthesis.blindSpot || "-";

    resultsEl.style.display = "block";
    document.getElementById("synthesis").style.display = "block";
  } catch (err) {
    errorEl.textContent = "Something went wrong reaching the server. Try again.";
    errorEl.style.display = "block";
  } finally {
    btn.disabled = false;
    loadingRow.classList.remove("active");
  }
});
</script>
</body>
</html>
